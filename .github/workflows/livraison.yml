


name: Livraison continue

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier que la page d'accueil existe
        run: test -f index.html

      - name: Verifier que la page a un titre
        run: grep -q '<h1>' index.html

      - name: Utiliser un secret
        env:
          MESSAGE_SECRET: ${{ secrets.MESSAGE_SECRET }}
        run: echo "Le secret vaut $MESSAGE_SECRET"

  construire:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer le site
        run: |
          mkdir -p _site
          cp *.html _site/
          echo "Version ${{ github.sha }} construite le $(date)" > _site/version.txt
          ls -l _site

      - name: Livrer l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: site-web
          path: _site/

